<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · ZeroProxy 仪表盘三方案</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3C/svg%3E">
<!--
  一次性原型 (prototype)：只为回答「仪表盘该长什么样」这一个问题。
  不是生产代码：数据是写死的假数据，没有任何后端交互，折叠进真实页面后本文件即删除。
  运行：ZP_PORT=8899 ./dev.sh  然后打开
        http://127.0.0.1:8899/static/proto-dashboard.html?variant=A
  三个方案: A (Ops Console 侧栏+密集表格) / B (Bento 磁贴网格) / C (Topology 拓扑优先深色)
  切换: 底部悬浮条左右箭头, 或键盘 ← →; 主题: 底部条右侧按钮 (或 &theme=dark)
-->
<style>
/* ============================================================
   共享: 设计令牌 + 假数据用的原子类。方案之间只共享令牌, 不共享布局。
   ============================================================ */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafafc; --text:#12141a; --sub:#6b7280;
  --line:#e6e8ec; --line-2:#eeeff3;
  --brand:#0a84ff; --brand-2:#5e5ce6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 2px 8px rgba(16,24,40,.06), 0 12px 32px -12px rgba(16,24,40,.14);
  --r-sm:10px; --r:14px; --r-lg:20px;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --bg:#0b0d12; --panel:#14171f; --panel-2:#191d26; --text:#eef1f6; --sub:#8b94a7;
  --line:#232833; --line-2:#1c212b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.info{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.pill.ghost{background:color-mix(in srgb,var(--sub) 14%,transparent);color:var(--sub)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:550;color:var(--sub)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm);font-weight:650}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:550;box-shadow:var(--shadow-sm);transition:.15s}
.btn:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));color:var(--brand)}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.tiny{padding:4px 9px;font-size:11.5px;border-radius:8px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--sub) 12%,transparent);color:var(--sub)}
.sw{position:relative;width:34px;height:20px;flex-shrink:0}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(14px)}

/* ---------- 浮动切换条 (原型专属, 明显不属于被评审的设计) ---------- */
.switcher{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;
  display:flex;align-items:center;gap:4px;padding:6px;
  background:#111318;color:#fff;border:1px solid rgba(255,255,255,.14);
  border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.switcher button{
  border:0;background:transparent;color:inherit;width:30px;height:30px;border-radius:50%;
  font-size:14px;line-height:1;display:grid;place-items:center;
}
.switcher button:hover{background:rgba(255,255,255,.14)}
.switcher .label{padding:0 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.switcher .label em{font-style:normal;color:#8b94a7;font-weight:500}
.switcher .sep{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 4px}

/* ============================================================
   方案 A — Ops Console: 固定侧栏 + 密集表格 + 右侧信息栏
   ============================================================ */
.A{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.A .side{
  background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.A .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 18px;font-weight:700;letter-spacing:-.02em}
.A .brand .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.A nav a{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;
  color:var(--sub);text-decoration:none
}
.A nav a:hover{background:var(--panel-2);color:var(--text)}
.A nav a.on{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);font-weight:600}
.A nav a .ic{width:16px;text-align:center;opacity:.9}
.A nav a .n{margin-left:auto;font-size:11px;color:var(--sub)}
.A .side .bot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--sub);line-height:1.7}
.A .main{padding:22px 26px 60px;min-width:0}
.A .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.A .top h1{margin:0;font-size:19px;letter-spacing:-.02em}
.A .top .crumb{font-size:12px;color:var(--sub)}
.A .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.A .kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow-sm)}
.A .kpi .k .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:600}
.A .kpi .k .val{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:5px;font-family:var(--mono)}
.A .kpi .k .val small{font-size:12px;font-weight:500;color:var(--sub);font-family:var(--sans)}
.A .cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media(max-width:1080px){.A .cols{grid-template-columns:1fr}}
.A .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.A .box>header{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-2)}
.A .box>header h2{margin:0;font-size:13px;font-weight:650}
.A .box .body{padding:12px 15px}
.A table{width:100%;border-collapse:collapse;font-size:13px}
.A thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);
  font-weight:600;padding:8px 15px;border-bottom:1px solid var(--line-2)
}
.A tbody td{padding:9px 15px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.A tbody tr:last-child td{border-bottom:0}
.A tbody tr:hover{background:var(--panel-2)}
.A .nname{display:flex;align-items:center;gap:9px;font-weight:600}
.A .nname .kind{font-size:10.5px;color:var(--sub);font-weight:500}
.A .acts{display:flex;gap:5px;justify-content:flex-end}
.A .chain-flow{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:12px}
.A .hop{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel-2);text-align:center}
.A .hop b{font-weight:600}
.A .arrow{color:var(--sub);text-align:center;line-height:1}
.A .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.A .kv:last-child{border-bottom:0}
.A .kv .k{color:var(--sub)}
.A .log{font-family:var(--mono);font-size:11.5px;line-height:1.85;color:var(--sub);max-height:190px;overflow:auto}
.A .log b{color:var(--text);font-weight:600}
.A .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.A .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* ============================================================
   方案 B — Bento: 无侧栏, 非对称磁贴网格
   ============================================================ */
.B{padding:22px 24px 70px;max-width:1180px;margin:0 auto}
.B .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.B .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
.B .brand .mk{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.B .addr{font-family:var(--mono);font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.B .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.B .t{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;box-shadow:var(--shadow-sm);min-width:0;position:relative;overflow:hidden
}
.B .t h3{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--sub);letter-spacing:.01em}
.B .hero{grid-column:span 5;background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 14%,var(--panel)),var(--panel) 62%)}
.B .hero .ip{font-family:var(--mono);font-size:32px;font-weight:650;letter-spacing:-.03em;margin:6px 0 2px}
.B .sub3{grid-column:span 7}
.B .nodes{grid-column:span 7}
.B .flow{grid-column:span 5}
.B .diag{grid-column:span 4}
.B .route{grid-column:span 4}
.B .upd{grid-column:span 4}
.B .traffic{grid-column:span 12}
@media(max-width:980px){
  .B .hero,.B .sub3,.B .nodes,.B .flow,.B .diag,.B .route,.B .upd{grid-column:span 12}
}
.B .ring{width:96px;height:96px;flex-shrink:0}
.B .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.B .ring .bg{stroke:var(--line)}
.B .ring .fg{stroke:var(--ok);transform:rotate(-90deg);transform-origin:50% 50%}
.B .ring text{fill:var(--text);font-size:22px;font-weight:650;font-family:var(--mono)}
.B .fmt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.B .fmt:first-of-type{border-top:0}
.B .fmt .u{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.B .nrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.B .nrow:first-child{border-top:0}
.B .nrow .nm{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;min-width:0}
.B .nrow .ad{font-family:var(--mono);font-size:11.5px;color:var(--sub)}
.B .flowline{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap;margin:10px 0 4px}
.B .node-chip{border:1px dashed var(--line);border-radius:999px;padding:6px 11px;background:var(--panel-2);font-size:12px}
.B .node-chip b{font-weight:600}
.B .node-chip.solid{border-style:solid;border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.B .checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.B .checks div{background:var(--panel-2);border-radius:9px;padding:8px 6px;text-align:center;font-size:11px;color:var(--sub)}
.B .checks div .dot{margin:0 auto 5px}
.B .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--line-2);padding-top:12px}
.B .mini div{font-size:11px;color:var(--sub)}
.B .mini b{display:block;font-family:var(--mono);font-size:15px;font-weight:650;color:var(--text);margin-top:2px}
.B .spark{display:flex;align-items:flex-end;gap:3px;height:54px}
.B .spark i{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--brand),color-mix(in srgb,var(--brand) 30%,transparent))}
.B .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}

/* ============================================================
   方案 C — Topology: 拓扑优先, 深色控制台
   ============================================================ */
.C{
  min-height:100vh;padding:20px 24px 70px;max-width:1240px;margin:0 auto;
  background:
    linear-gradient(var(--line-2) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,var(--line-2) 1px,transparent 1px) 0 0/34px 100%;
}
[data-theme="light"] .C{background:linear-gradient(var(--line-2) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,var(--line-2) 1px,transparent 1px) 0 0/34px 100%}
.C *{position:relative}
.C .ribbon{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 15px;margin-bottom:18px;box-shadow:var(--shadow-sm)
}
.C .brand{display:flex;align-items:center;gap:9px;font-weight:700}
.C .brand .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.C h1{font-size:15px;margin:0 0 2px;font-weight:650}
.C .stage{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px
}
.C .stage .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.C .stage .hd h2{margin:0;font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.C .path{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px}
@media(max-width:900px){.C .path{grid-template-columns:1fr;justify-items:stretch}.C .link{justify-self:center}}
.C .node{
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--panel-2);
  min-width:0
}
.C .node .who{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:600}
.C .node .id{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:6px;word-break:break-all}
.C .node .meta{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.7}
.C .node.accent{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));background:color-mix(in srgb,var(--brand) 7%,var(--panel-2))}
.C .link{
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--sub);
  white-space:nowrap
}
.C .wire{width:78px;height:2px;background:repeating-linear-gradient(90deg,var(--brand) 0 8px,transparent 8px 14px);background-size:14px 2px;animation:Cflow 1.1s linear infinite}
@media(max-width:900px){.C .wire{width:2px;height:44px;background:repeating-linear-gradient(180deg,var(--brand) 0 8px,transparent 8px 14px);background-size:2px 14px}}
@keyframes Cflow{to{background-position:14px 0}}
.C .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.C .cols{grid-template-columns:1fr}}
.C .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.C .panel>header{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line-2);font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.07em}
.C .panel .body{padding:14px 15px}
.C .srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.C .srow:last-child{border-bottom:0}
.C .srow .nm{font-weight:600}
.C .srow .ad{font-family:var(--mono);font-size:11px;color:var(--sub)}
.C .meter{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.C .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.C .stream{font-family:var(--mono);font-size:11.5px;line-height:2;max-height:220px;overflow:auto}
.C .stream .t{color:var(--sub)}
.C .stream .ok{color:var(--ok)}
.C .stream .w{color:var(--warn)}
.C .ctrls{display:flex;flex-direction:column;gap:10px}
.C .ctl{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.C .ctl:last-child{border-bottom:0}

/* 原型条在小屏别挡内容 */
@media(max-width:560px){.switcher .label em{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<div class="switcher">
  <button id="prev" title="上一套 (←)">‹</button>
  <div class="label" id="sw-label">A <em>Ops Console</em></div>
  <button id="next" title="下一套 (→)">›</button>
  <div class="sep"></div>
  <button id="theme" title="切换深浅色">◐</button>
</div>

<script>
/* ---------- 假数据 (取自真机 hkk.i3.pub 的真实形态, 数值为示例) ---------- */
const D = {
  domain: "hkk.i3.pub", panel: "https://hkk.i3.pub:8899", user: "eric",
  egress: "203.0.113.9", uptime: "3 小时 45 分", version: "v2.4.0", latest: "v2.4.1",
  host: "Ubuntu 24.04.4 LTS · amd64",
  subs: [
    ["Base64", "…/sub/Z4LAmU5rE3iYvqwboQXb2I7P4Q8b0VzJ"],
    ["Clash", "…/sub/Z4LAmU5rE3iYvqwboQXb2I7P4Q8b0VzJ?format=clash"],
    ["sing-box", "…/sub/Z4LAmU5rE3iYvqwboQXb2I7P4Q8b0VzJ?format=singbox"],
  ],
  nodes: [
    {n:"VLESS Reality", proto:"vless", addr:"hkk.i3.pub:8443", bare:"443", on:true, ms:136, ip:"203.0.113.9", tone:"ok", note:"反封锁最强组合 · TCP+Vision"},
    {n:"VLESS XHTTP Reality", proto:"vless", addr:"hkk.i3.pub:8445", bare:"8445", on:true, ms:151, ip:"203.0.113.9", tone:"ok", note:"新一代 HTTP 形态 · 特征像普通网站"},

/* ---------- 切换器 ---------- */
const V = {A:["Ops Console","侧栏 + 密集表格"], B:["Bento","磁贴网格"], C:["Topology","拓扑优先"]};
const qp = new URLSearchParams(location.search);
let cur = (qp.get("variant") || "A").toUpperCase();
if(!V[cur]) cur = "A";
let theme = qp.get("theme") || "light";

function draw(){
  document.documentElement.dataset.theme = theme;
  document.body.dataset.variant = cur;
  document.getElementById("app").innerHTML = ({A, B, C}[cur])();
  document.getElementById("sw-label").innerHTML = `${cur} <em>${V[cur][0]} · ${V[cur][1]}</em>`;
  const u = new URL(location.href); u.searchParams.set("variant", cur); u.searchParams.set("theme", theme);
  history.replaceState(null, "", u);
}
function go(step){
  const keys = Object.keys(V); cur = keys[(keys.indexOf(cur) + step + keys.length) % keys.length]; draw();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; draw(); };
document.addEventListener("keydown", e => {
  const t = document.activeElement.tagName;
  if(t === "INPUT" || t === "TEXTAREA" || document.activeElement.isContentEditable) return;
  if(e.key === "ArrowLeft") go(-1);
  if(e.key === "ArrowRight") go(1);
});
