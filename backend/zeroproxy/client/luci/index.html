<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroProxy · 路由器管理</title>
<style>
/* 与面板同一套设计语言 (卡片 / 圆角 / 同一组状态色), 但只带这一个页面需要的部分:
   路由器上的 UI 不该为了一套样式表拖一个前端框架。 */
:root{
  --bg:#f3f4f7; --card:#fff; --card2:#fafbfc; --text:#101318; --sub:#6b7280;
  --border:rgba(16,19,24,.10); --border-soft:rgba(16,19,24,.06);
  --accent:#0a84ff; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 14px 36px -18px rgba(16,24,40,.24);
  --radius:14px; --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0a0c11; --card:#131822; --card2:#171d29; --text:#eef1f6; --sub:#8b94a7;
         --border:rgba(255,255,255,.10); --border-soft:rgba(255,255,255,.06);
         --shadow:0 1px 3px rgba(0,0,0,.5),0 20px 48px -20px rgba(0,0,0,.8); }
}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--text);
     font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:16px 18px}
h1{margin:0 0 2px;font-size:17px;letter-spacing:-.02em}
h2{margin:0;font-size:13.5px;font-weight:650}
.tile{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--sub)}
.fs-sm{font-size:12.5px}
.fs-xs{font-size:11.5px}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
      font-size:11.5px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.off{background:var(--border-soft);color:var(--sub)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;
     padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.18s var(--ease)}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 11px;font-size:12px}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--border))}
.btn:disabled{opacity:.55;cursor:not-allowed}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
     background:var(--card2);color:var(--text);font:13px/1.4 var(--mono)}
input[type=text]:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srv{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border-soft)}
.srv:first-of-type{border-top:0}
.srv .info{flex:1;min-width:0}
.srv .nm{font-weight:650;font-size:13.5px}
.srv .bs{font-family:var(--mono);font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--sub);font-size:12.5px;padding:8px 0}
.switch{position:relative;width:62px;height:34px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;border-radius:999px;cursor:pointer;background:var(--bg);
  border:1px solid var(--border);transition:background .28s var(--ease),box-shadow .28s var(--ease)}
.switch .knob{position:absolute;width:26px;height:26px;border-radius:50%;left:3px;top:3px;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.32);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.switch input:checked + .track{background:linear-gradient(135deg,var(--ok),#16a34a);border-color:transparent;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 16%,transparent),0 8px 22px -10px var(--ok)}
.switch input:checked + .track .knob{transform:translateX(28px)}
/* 未授权时它是禁用的 —— 必须看得出来 (灰掉 + 不给手型光标), 否则用户会以为"点不开是坏了" */
.switch input:disabled + .track{opacity:.5;cursor:not-allowed}
.swwrap{display:flex;flex-direction:column;align-items:center;gap:5px}
pre{margin:0;padding:12px;background:var(--card2);border:1px solid var(--border-soft);border-radius:10px;
    font:12px/1.5 var(--mono);color:var(--sub);max-height:260px;overflow:auto;white-space:pre-wrap}
details summary{cursor:pointer;font-size:12.5px;color:var(--sub)}
details summary:hover{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);
       padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.24s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ZeroProxy</h1>
    <div class="muted fs-sm" id="sub">正在读取状态…</div>
  </div>

  <div class="card">
    <div class="tile"><h2>全屋代理</h2><span class="grow"></span><span id="mode" class="muted fs-xs"></span></div>
    <div class="row">
      <div class="swwrap">
        <label class="switch" title="开 / 关 全屋代理">
          <input type="checkbox" id="toggle">
          <span class="track"><span class="knob"></span></span>
        </label>
        <span class="fs-xs muted" id="toggle-txt">—</span>
      </div>
      <div class="fs-sm muted" style="flex:1;min-width:200px">
        开启后, 连在这台路由器上的所有设备 (手机 / 电脑 / 电视) 自动走分流代理。
      </div>
    </div>
  </div>

  <div class="card">
    <div class="tile"><h2>服务器</h2><span class="grow"></span>
      <button class="btn small" id="refresh">重新拉取节点</button></div>
    <div id="servers"><div class="empty">正在读取…</div></div>
  </div>

  <div class="card">
    <div class="tile"><h2>添加服务器</h2></div>
    <div class="fs-sm muted" style="margin-bottom:10px">
      到那台服务器的面板「客户端」页生成安装命令, 复制其中 <span class="mono">https://…/c/…</span> 这一段粘进来。
      不用再 SSH, 也不用重跑安装。
    </div>
    <div class="row">
      <input type="text" id="url" placeholder="https://你的面板:8899/c/xxxxxxxx" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="add">添加</button>
    </div>
    <div class="fs-xs muted" id="add-hint" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <details>
      <summary>最近日志</summary>
      <pre id="log">展开后加载…</pre>
    </details>
  </div>
</div>
<div id="toast"></div>
<!-- 走 cgi 取脚本: nginx+fcgiwrap 的固件上静态目录不一定在浏览器能到的地方 -->
<script src="/cgi-bin/zeroproxy?file=app.js"></script>
</body>
</html>
